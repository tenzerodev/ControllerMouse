name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh

      - name: Zip
        run: ditto -c -k --keepParent ControllerMouse.app ControllerMouse-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControllerMouse-macOS
          path: ControllerMouse-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ControllerMouse ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ControllerMouse-macOS.zip
          generate_release_notes: true
