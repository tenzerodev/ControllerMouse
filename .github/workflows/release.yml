name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh
      - name: Zip
        run: ditto -c -k --keepParent ControllerMouse.app ControllerMouse-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerMouse-macOS
          path: ControllerMouse-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build single-file .exe
        run: dotnet publish windows/ControllerMouse.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Add SDL2.dll (controller library)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2.30.9 -R libsdl-org/SDL -p "SDL2-2.30.9-win32-x64.zip" -O sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2
          Copy-Item sdl2/SDL2.dll publish/

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ControllerMouse-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerMouse-Windows
          path: ControllerMouse-Windows.zip

  release:
    needs: [macos, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ControllerMouse ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
